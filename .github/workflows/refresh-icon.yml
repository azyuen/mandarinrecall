name: Refresh home-screen icon
on:
  push:
    paths:
      - '.github/workflows/refresh-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate edge-to-edge PNG icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open('icon.png').convert('RGBA')
          alpha = im.getchannel('A')
          # Crop away transparent canvas around the red rounded-square artwork.
          bounds = alpha.point(lambda p: 255 if p > 20 else 0).getbbox()
          if bounds:
              im = im.crop(bounds)
          # iOS displays transparent edges as black. Use the app's deep red behind
          # the artwork so the entire shortcut tile stays red, not black.
          bg = Image.new('RGBA', im.size, (172, 0, 12, 255))
          bg.alpha_composite(im)
          for size, path in [(512, 'icon.png'), (180, 'apple-touch-icon.png')]:
              bg.resize((size,size), Image.Resampling.LANCZOS).convert('RGB').save(path, 'PNG', optimize=True)
          PY
      - name: Commit refreshed icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Fix black padding around home-screen icon" && git push)
